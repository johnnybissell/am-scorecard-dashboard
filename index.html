<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AM Scorecard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:#F5F5FA;color:#1F1B2E;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border:1px solid #E5E5EE;border-radius:16px;padding:48px 40px;text-align:center;max-width:400px;width:100%}
h1{font-size:22px;font-weight:700;margin-bottom:12px}
.accent{background:linear-gradient(90deg,#5E3DBC,#00B6E5);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#5C5775;line-height:1.6;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:40px;margin-bottom:16px">📊</div>
  <h1><span class="accent">AM Scorecard</span></h1>
  <p>Please use your personal dashboard link.<br>Contact your manager if you need access.</p>
</div>
</body>
</html>
