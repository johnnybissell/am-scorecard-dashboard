<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AM Commission Dashboard</title>
<style>
:root {
  --purple:#5E3DBC;--purple-dark:#3B2480;--purple-light:#EFEAFB;
  --teal:#00B6E5;--bg:#F5F5FA;--surface:#FFFFFF;--border:#E5E5EE;
  --text:#1F1B2E;--text-soft:#5C5775;--text-mute:#8C8AA3;
  --good:#1FB876;--good-bg:#E5F8F0;--warn:#F59E0B;--warn-bg:#FEF4DB;
  --bad:#EF4444;--bad-bg:#FDECEC;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px}
.page{max-width:860px;margin:0 auto;padding:28px 20px 80px}
.hdr{margin-bottom:28px}
.hdr h1{font-size:24px;font-weight:700;letter-spacing:-0.01em;margin-bottom:4px}
.hdr h1 .accent{background:linear-gradient(90deg,var(--purple),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr-sub{color:var(--text-soft);font-size:13px}
.total-card{background:linear-gradient(135deg,var(--purple),var(--purple-dark));border-radius:14px;padding:24px 28px;color:white;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.total-card .label{font-size:13px;opacity:0.8;margin-bottom:4px}
.total-card .amount{font-size:42px;font-weight:800;letter-spacing:-0.02em}
.total-card .not-eligible{font-size:16px;font-weight:600;opacity:0.7}
.total-card .meta{text-align:right}
.total-card .meta .month-label{font-size:13px;opacity:0.8}
.total-card .meta .plan-note{font-size:12px;opacity:0.6;margin-top:4px}
.section-title{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-mute);margin:24px 0 10px}
.commission-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.comm-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.comm-card .window{font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-mute);margin-bottom:8px}
.comm-card .payout{font-size:26px;font-weight:800;color:var(--text);margin-bottom:6px}
.comm-card .payout.earned{color:var(--good)}
.comm-card .payout.zero{color:var(--text-mute)}
.comm-card .reason{font-size:12px;color:var(--text-soft);line-height:1.4}
.comm-card .metrics-row{display:flex;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.comm-card .metric{flex:1}
.comm-card .metric .m-label{font-size:10px;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.04em;font-weight:600}
.comm-card .metric .m-val{font-size:14px;font-weight:700;margin-top:2px}
.comm-card .metric .m-val.good{color:var(--good)}
.comm-card .metric .m-val.bad{color:var(--bad)}
.comm-card .metric .m-val.muted{color:var(--text-mute)}
.no-data{color:var(--text-mute);font-style:italic;font-size:13px;padding:8px 0}
/* month tabs */
.month-tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 14px rgba(31,27,46,0.08);padding:10px 20px;display:flex;gap:4px;justify-content:center;flex-wrap:wrap;z-index:50}
.month-tab{background:transparent;border:1px solid transparent;cursor:pointer;padding:7px 12px;font-size:11px;font-weight:600;color:var(--text-soft);border-radius:8px;font-family:inherit;transition:background 0.12s}
.month-tab:hover{background:var(--purple-light);color:var(--purple-dark)}
.month-tab.active{background:var(--purple);color:white;border-color:var(--purple)}
.month-tab .yr{font-size:9px;opacity:0.7;margin-left:3px}
/* landing */
.landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;gap:16px}
.landing h2{font-size:20px;font-weight:700}
.landing p{color:var(--text-soft);max-width:320px;line-height:1.6}
/* earnings history */
.history-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.history-table th{padding:10px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-mute);background:#FAFAFE;border-bottom:1px solid var(--border);text-align:center}
.history-table th:first-child{text-align:left}
.history-table td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:center;font-size:13px}
.history-table td:first-child{text-align:left;font-weight:600}
.history-table tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.pill.green{background:var(--good-bg);color:var(--good)}
.pill.muted{background:#F0EFF5;color:var(--text-mute)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.not-effective{color:var(--text-mute);font-style:italic;font-size:12px}
</style>
</head>

  if (nrr == null) return {amount:0, rate:0, reason:'No cohort data'};
  const matrix = {
    0.90: {1.00:0.010,1.05:0.015,1.10:0.020,1.15:0.025,1.20:0.030},
    0.95: {1.00:0.020,1.05:0.025,1.10:0.030,1.15:0.035,1.20:0.040},
    0.98: {1.00:0.030,1.05:0.035,1.10:0.040,1.15:0.045,1.20:0.050},
  };
  const grrTier = grr >= 0.98 ? 0.98 : grr >= 0.95 ? 0.95 : 0.90;
  const nrrTier = nrr >= 1.20 ? 1.20 : nrr >= 1.15 ? 1.15 : nrr >= 1.10 ? 1.10 : nrr >= 1.05 ? 1.05 : 1.00;
  const rate = matrix[grrTier][nrrTier];
  const arr = cohortCurrentMRR * 12;
  const amount = Math.round(arr * rate);
  return {amount, rate, arr, reason: `${(rate*100).toFixed(1)}% of cohort ARR (${Math.round(arr).toLocaleString()})`};
}
function calcOnboarding(avgDays, csatScores) {
  if (!csatScores || csatScores.length === 0) return {amount:0, reason:'No CSAT responses'};
  const avg = csatScores.reduce((a,b)=>a+b,0) / csatScores.length;
  if (avg < 4.5) return {amount:0, avgCsat:avg, reason:`CSAT avg ${avg.toFixed(2)} below 4.5`};
  if (avgDays == null) return {amount:0, avgCsat:avg, reason:'No onboarding data'};
  if (avgDays >= 70 && avgDays <= 79) return {amount:500, avgCsat:avg, reason:'Tier 3 — 70–79 days'};
  if (avgDays >= 80 && avgDays <= 89) return {amount:400, avgCsat:avg, reason:'Tier 2 — 80–89 days'};
  if (avgDays >= 90 && avgDays <= 95) return {amount:300, avgCsat:avg, reason:'Tier 1 — 90–95 days'};
  return {amount:0, avgCsat:avg, reason: avgDays < 70 ? `${avgDays.toFixed(0)} days (below tier range)` : `${avgDays.toFixed(0)} days (above tier range)`};
}

function getCommission(ym, am) {
  const monthData = (D.by_month[ym] || {});
  const m = (monthData.metrics || {})[am] || {};
  const dr = (monthData.drilldowns || {})[am] || {};
  const cohort13 = (dr.cohort || {})['_13'] || [];
  const cohortMRR13 = cohort13.reduce((s,r) => s + (r.current || 0), 0);
  const csatScores = (dr.csat || {}).scores || null;
  const r3  = calc3mo(m.nrr_3mo, m.grr_3mo);
  const r6  = calc6mo(m.nrr_6mo, m.grr_6mo);
  const r13 = calc13mo(m.nrr_13mo, m.grr_13mo, cohortMRR13);
  const rob = calcOnboarding(m.onboarding_time, csatScores);
  const total = r3.amount + r6.amount + r13.amount + rob.amount;
  return {r3, r6, r13, rob, total, m, dr};
}

let currentMonth = D.default_month;

function renderTabs() {
  const tabs = document.getElementById('month-tabs');
  tabs.innerHTML = D.months.map(ym => {
    const [y,mo] = ym.split('-');
    const cls = ym === currentMonth ? 'active' : '';
    return `<button class="month-tab ${cls}" onclick="selectMonth('${ym}')">${MONTHS_EN[parseInt(mo)-1]}<span class="yr">${y}</span></button>`;
  }).join('');
}

function selectMonth(ym) {
  currentMonth = ym;
  renderMain();
  renderTabs();
}

function commCard(label, result, nrr, grr, extra) {
  const earned = result.amount > 0;
  return `<div class="comm-card">
    <div class="window">${label}</div>
    <div class="payout ${earned ? 'earned' : 'zero'}">${earned ? fmtMoney(result.amount) : '$0'}</div>
    <div class="reason">${result.reason}</div>
    ${extra || ''}
    <div class="metrics-row">
      <div class="metric">
        <div class="m-label">NRR</div>
        <div class="m-val ${nrr != null && nrr >= 1 ? 'good' : nrr != null ? 'bad' : 'muted'}">${fmtPct(nrr)}</div>
      </div>
      <div class="metric">
        <div class="m-label">GRR</div>
        <div class="m-val ${grr != null && grr >= 1 ? 'good' : grr != null ? 'bad' : 'muted'}">${fmtPct(grr)}</div>
      </div>
    </div>
  </div>`;
}

function renderMain() {
  const eligible = currentMonth >= PLAN_START;
  const c = getCommission(currentMonth, currentAM);
  const {r3, r6, r13, rob, total, m} = c;

  let totalHtml = eligible
    ? `<div class="amount">${fmtMoney(total)}</div><div class="reason" style="opacity:0.8;font-size:13px;margin-top:4px">${total === 0 ? 'No thresholds met this month' : 'Estimated commission'}</div>`
    : `<div class="not-eligible">Commission plan not yet active</div><div style="font-size:12px;opacity:0.6;margin-top:4px">Effective Oct 2025</div>`;

  document.getElementById('main').innerHTML = `
    <div class="hdr">
      <h1>👋 <span class="accent">${currentAM.split(' ')[0]}'s Commission</span></h1>
      <div class="hdr-sub">${monthLong(currentMonth)} · AM Scorecard</div>
    </div>
    <div class="total-card">
      <div>
        <div class="label">ESTIMATED TOTAL COMMISSION</div>
        ${totalHtml}
      </div>
      <div class="meta">
        <div class="month-label">${monthLong(currentMonth)}</div>
        <div class="plan-note">NRR + Onboarding Plan</div>
      </div>
    </div>

    ${eligible ? `
    <div class="section-title">Cohort Commissions</div>
    <div class="commission-grid">
      ${commCard('3-Month Cohort', r3, m.nrr_3mo, m.grr_3mo)}
      ${commCard('6-Month Cohort', r6, m.nrr_6mo, m.grr_6mo)}
      <div class="comm-card">
        <div class="window">13-Month Cohort</div>
        <div class="payout ${r13.amount > 0 ? 'earned' : 'zero'}">${r13.amount > 0 ? fmtMoney(r13.amount) : '$0'}</div>
        <div class="reason">${r13.reason}</div>
        <div class="metrics-row">
          <div class="metric"><div class="m-label">NRR</div><div class="m-val ${m.nrr_13mo != null && m.nrr_13mo >= 1 ? 'good' : m.nrr_13mo != null ? 'bad' : 'muted'}">${fmtPct(m.nrr_13mo)}</div></div>
          <div class="metric"><div class="m-label">GRR</div><div class="m-val ${m.grr_13mo != null && m.grr_13mo >= 0.9 ? 'good' : m.grr_13mo != null ? 'bad' : 'muted'}">${fmtPct(m.grr_13mo)}</div></div>
        </div>
      </div>
      <div class="comm-card">
        <div class="window">Onboarding</div>
        <div class="payout ${rob.amount > 0 ? 'earned' : 'zero'}">${rob.amount > 0 ? fmtMoney(rob.amount) : '$0'}</div>
        <div class="reason">${rob.reason}</div>
        <div class="metrics-row">
          <div class="metric"><div class="m-label">Avg Days</div><div class="m-val ${m.onboarding_time != null && m.onboarding_time <= 95 && m.onboarding_time >= 70 ? 'good' : 'muted'}">${m.onboarding_time != null ? m.onboarding_time.toFixed(0)+' days' : '—'}</div></div>
          <div class="metric"><div class="m-label">CSAT Avg</div><div class="m-val ${rob.avgCsat != null && rob.avgCsat >= 4.5 ? 'good' : rob.avgCsat != null ? 'bad' : 'muted'}">${rob.avgCsat != null ? rob.avgCsat.toFixed(2)+'/5' : '—'}</div></div>
        </div>
      </div>
    </div>
    ` : `<div style="margin-top:16px;color:var(--text-mute);font-style:italic">Commission plan effective October 2025. Historical data shown for reference.</div>`}

    <div class="section-title">Earnings History</div>
    <table class="history-table">
      <thead><tr>
        <th>Month</th><th>3-Mo</th><th>6-Mo</th><th>13-Mo</th><th>Onboarding</th><th>Total</th>
      </tr></thead>
      <tbody>
        ${D.months.slice().reverse().map(ym => {
          if (ym >= PLAN_START) {
            const h = getCommission(ym, currentAM);
            const pill = (n) => n > 0 ? `<span class="pill green">${fmtMoney(n)}</span>` : `<span class="pill muted">$0</span>`;
            const rowClass = ym === currentMonth ? 'style="background:var(--purple-light)"' : '';
            return `<tr ${rowClass}>
              <td>${monthLong(ym)}</td>
              <td>${pill(h.r3.amount)}</td>
              <td>${pill(h.r6.amount)}</td>
              <td>${pill(h.r13.amount)}</td>
              <td>${pill(h.rob.amount)}</td>
              <td><strong style="color:var(--purple-dark)">${h.total > 0 ? fmtMoney(h.total) : '—'}</strong></td>
            </tr>`;
          } else {
            return `<tr><td>${monthLong(ym)}</td><td colspan="5" class="not-effective">Commission plan not yet active</td></tr>`;
          }
        }).join('')}
      </tbody>
    </table>
  `;
}

document.addEventListener('DOMContentLoaded', () => {
  if (!currentAM) {
    document.getElementById('main').innerHTML = `
      <div class="landing">
        <div style="font-size:48px">🔒</div>
        <h2>Personal link required</h2>
        <p>This dashboard requires your individual link. Contact your manager to get your personal URL.</p>
      </div>`;
    return;
  }
  renderMain();
  renderTabs();
});
</script>
<div class="page" id="main"></div>
<div class="month-tabs" id="month-tabs"></div>
</body>
</html>
